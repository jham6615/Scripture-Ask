# Supabase project config (used by the CLI). Link with:
#   supabase link --project-ref gkwcekrthkkumwfztlln
project_id = "gkwcekrthkkumwfztlln"

# The AI proxy skips the gateway's JWT check and verifies the user's JWT itself, so it can answer a
# missing session with a clear 401 { code: 'auth_required' }. It then meters every call in
# public.ai_usage (see supabase/functions/ai/index.ts and migration 0004).
[functions.ai]
verify_jwt = false

# Stripe calls this webhook directly (no Supabase JWT); we verify the Stripe signature inside instead.
[functions.stripe-webhook]
verify_jwt = false

# RevenueCat calls this webhook directly (no Supabase JWT); we verify a shared Authorization secret.
[functions.revenuecat-webhook]
verify_jwt = false

# create-checkout intentionally keeps verify_jwt = true (the default): it requires a signed-in user,
# whose JWT supabase.functions.invoke attaches automatically.
